# Routine updates preserve the supported compatibility lines.
# Major upgrades are deliberate; security updates retain their separate policy.

version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      gomod:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 0
